<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minimalist Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Minimalist Shop</h1>
        <p>Discover our clean essentials</p>
    </header>

    <div class="container">
        <h2>Our Products</h2>
        <div id="products-container" class="product-grid"></div>
    </div>

    <script>
        // Fetch products from backend and display them
        async function fetchProducts() {
            try {
                const response = await fetch('http://localhost:5000/api/products');
                const products = await response.json();
                const container = document.getElementById('products-container');
                
                container.innerHTML = products.map(product => `
                    <div class="card">
                        <img src="${product.image}" alt="${product.name}">
                        <h3>${product.name}</h3>
                        <p>$${product.price}</p>
                        <a href="product.html?id=${product._id}" class="btn">View Details</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error loading products:", error);
            }
        }
        fetchProducts();
    </script>
</body>
</html>
