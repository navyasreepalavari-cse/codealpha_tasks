<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Create an Account</h1>
        <a href="index.html" style="color: white; text-decoration: none;">← Back to Shop</a>
    </header>

    <div class="container" style="max-width: 400px; background: white; padding: 30px; border-radius: 8px; margin-top: 50px;">
        <form id="register-form">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Full Name</label>
                <input type="text" id="reg-name" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Email Address</label>
                <input type="email" id="reg-email" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px;">Password</label>
                <input type="password" id="reg-password" required style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Register</button>
        </form>
        <p id="reg-message" style="margin-top: 15px; text-align: center; color: #dc3545;"></p>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const messageElement = document.getElementById('reg-message');

            try {
                const response = await fetch('http://localhost:5000/api/users/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageElement.style.color = '#28a745';
                    messageElement.innerText = "Registration successful! Redirecting...";
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    messageElement.style.color = '#dc3545';
                    messageElement.innerText = data.error || "Registration failed.";
                }
            } catch (error) {
                messageElement.style.color = '#dc3545';
                messageElement.innerText = "Error connecting to the backend.";
            }
        });
    </script>
</body>
</html>
